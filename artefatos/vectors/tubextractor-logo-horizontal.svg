<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <style>
      .brand-tub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 82px; font-weight: 800; fill: #FFFFFF; }
      .brand-ext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 82px; font-weight: 800; fill: #FF4D4D; }
      .brand-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: 5px; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="280" rx="28" fill="#121418"/>

  <!-- Mini Icon Frame -->
  <g transform="translate(48, 40) scale(0.625)">
    <rect width="320" height="320" rx="72" fill="#1C1F26"/>
    <g transform="translate(30, 20)" stroke-linecap="round" stroke-width="13">
      <line x1="20" y1="20" x2="55" y2="20" stroke="#FF4444"/>
      <line x1="20" y1="45" x2="90" y2="45" stroke="#FF4F4B"/>
      <line x1="20" y1="70" x2="75" y2="70" stroke="#FF5C54"/>
      <line x1="90" y1="70" x2="128" y2="70" stroke="#FF5C54"/>
      <line x1="20" y1="95" x2="165" y2="95" stroke="#FF6A5E"/>
      <line x1="20" y1="120" x2="70" y2="120" stroke="#FF7969"/>
      <line x1="85" y1="120" x2="200" y2="120" stroke="#FF7969"/>
      <line x1="20" y1="145" x2="240" y2="145" stroke="#FF8A7C"/>
      <line x1="20" y1="170" x2="240" y2="170" stroke="#FF9C90"/>
      <line x1="20" y1="195" x2="115" y2="195" stroke="#FFB2A8"/>
      <line x1="130" y1="195" x2="200" y2="195" stroke="#FFB2A8"/>
      <line x1="20" y1="220" x2="165" y2="220" stroke="#FFCCC6"/>
      <line x1="20" y1="245" x2="55" y2="245" stroke="#FFE3E0"/>
      <line x1="70" y1="245" x2="128" y2="245" stroke="#FFE3E0"/>
      <line x1="20" y1="270" x2="90" y2="270" stroke="#F5F5F7"/>
