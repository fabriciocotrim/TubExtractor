  <!-- Typography -->
  <text x="290" y="145" class="brand-tub">Tub<tspan class="brand-ext">Extractor</tspan></text>
  <text x="294" y="195" class="brand-sub">BULK YOUTUBE TRANSCRIPTIONS</text>
