name: Bug report
description: Something in TubExtractor does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This is a personal project: there is no response deadline.
        Do not paste personal data. Public YouTube links only.
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Shown in Android settings → Apps → TubExtractor.
      placeholder: "1.4.1"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version and device
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Example YouTube link
      description: A public video, playlist or channel where the problem happens.
    validations:
      required: false
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
